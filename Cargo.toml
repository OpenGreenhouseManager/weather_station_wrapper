[package]
name = "weather_station_wrapper"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
greenhouse_core = "0.2.0"
reqwest = { version = "0.12.24", features = ["json"] }
rust_socketio = "0.6.0"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "tokio-macros"] }
uom = { version = "0.37.0", features = ["si", "autoconvert"] }
url = "2.5.7"
